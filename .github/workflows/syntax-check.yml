---
name: Syntax Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install ansible

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r requirements.yml

      - name: Create dummy vault password file
        run: |
          echo 'ci-dummy-vault-password' > .vault_password

      - name: Syntax check - common
        run: |
          ansible-playbook playbooks/common.yml --syntax-check

      - name: Syntax check - postgresql
        run: |
          ansible-playbook playbooks/postgresql.yml --syntax-check

      - name: Syntax check - upgrade
        run: |
          ansible-playbook playbooks/upgrade.yml --syntax-check
