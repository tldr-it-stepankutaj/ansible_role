---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: debian-ssh
    image: debian:bookworm
    pre_build_image: true
    command: /bin/systemd
    privileged: true
  - name: centos-ssh
    image: rockylinux:9
    pre_build_image: true
    command: /usr/sbin/init
    privileged: true
provisioner:
  name: ansible
verifier:
  name: ansible
