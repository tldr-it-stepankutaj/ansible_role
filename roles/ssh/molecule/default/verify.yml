---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check sshd_config exists
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config
      register: sshd_config

    - name: Assert sshd_config exists
      ansible.builtin.assert:
        that:
          - sshd_config.stat.exists

    - name: Check sshd_config permissions
      ansible.builtin.assert:
        that:
          - sshd_config.stat.mode == '0600'
