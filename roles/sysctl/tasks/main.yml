---

- name: Include os-specific vars
  include_tasks: 'vars.yml'

- name: Include distribution installation
  include_tasks: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      skip: true

- name: setup sysctl.conf
  sysctl:
    name: "{{item.name}}"
    value: "{{item.value}}"
    state: present
  with_items:
    - "{{sysctl}}"

