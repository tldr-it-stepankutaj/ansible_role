### PRO GENEROVANI CERTIFIKATU JE DEFAULTNE POVOLENO ZADAVANI PODROBNYCH INFORMACI O CERTIFIKATU(PARAMETR 'ORG')
### PRO PRIPAD, KDY BUDE STACIT GENEROVAT CERTIFIKAT POUZE S UDAJEM 'COMMON NAME' JE POTREBA NASTAVIT
### PROMENOU 'easyrsa.pki.easyrsa_dn' na 'cn'

# easyrsa:
#   pki:
#     - name: 'pki1'         				  # NO default
#       easyrsa_dn: 'cn_only'         # default: 'org'
#       ca_expire: 1825               # default: 3650
#       cert_expire: 365              # default: 730
#
#       cacerts:
#         cn: 'Barok CA'              # NO default
#         email: 'name@domain.tld'    # default: ''
#         org_name: 'Firma'           # default: 'Firma'
