#           country: 'SK'             # default: 'CZ'
#           state: 'Kanada'    		    # default: 'Ceska Republika'
#           city: 'Toronto'       		# default: 'Hradec Kralove'
#           org_name: 'Barok'        	# default: 'Firma'
#           email: 'name@mail.tld'    # default: ''
#           org_unit: 'Obchod'     		# default: 'IT'
