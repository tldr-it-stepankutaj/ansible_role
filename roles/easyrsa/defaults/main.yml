easyrsa_installdir: '/srv/easy-rsa'

### CACERTS DEFAULT DEFINITION ###
easyrsa_ca_country_name_default: 'CZ'
easyrsa_ca_state_default: 'Ceska Republika'
easyrsa_ca_city_default: 'Hradec Kralove'
easyrsa_ca_org_name_default: 'Firma'
easyrsa_ca_email_default: ''
easyrsa_ca_org_unit_default: 'IT'
### END ###

### SERVERCERTS DEFAULT DEFINITOIN ###
easyrsa_server_country_name_default: 'CZ'
easyrsa_server_state_default: 'Ceska Republika'
easyrsa_server_city_default: 'Hradec Kralove'
easyrsa_server_org_name_default: 'Firma'
easyrsa_server_email_default: ''
easyrsa_server_org_unit_default: 'IT'
### END ###

### CLIENTCERTS DEFAULT DEFINITOIN ###
easyrsa_client_country_name_default: 'CZ'
easyrsa_client_state_default: 'Ceska Republika'
easyrsa_client_city_default: 'Hradec Kralove'
easyrsa_client_org_name_default: 'Firma'
easyrsa_client_email_default: ''
easyrsa_client_org_unit_default: 'IT'
### END ###
 
