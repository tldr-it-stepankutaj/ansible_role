---

- name: Upgrade all packages (dnf)  # noqa: package-latest
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
  register: upgrade_dnf_result
  when: ansible_distribution_major_version | int >= 8
  tags:
    - upgrade

- name: Upgrade all packages (yum)  # noqa: package-latest
  ansible.builtin.yum:
    name: "*"
    state: latest
    update_cache: true
  register: upgrade_yum_result
  when: ansible_distribution_major_version | int < 8
  tags:
    - upgrade

- name: Remove unused packages
  ansible.builtin.dnf:
    autoremove: true
  when:
    - upgrade_autoremove | bool
    - ansible_distribution_major_version | int >= 8
  tags:
    - upgrade

- name: Clean package cache
  ansible.builtin.command: "{{ 'dnf' if ansible_distribution_major_version | int >= 8 else 'yum' }} clean all"
  when: upgrade_clean_cache | bool
  changed_when: false
  tags:
    - upgrade

- name: Check if reboot is required (RedHat)
  ansible.builtin.command: needs-restarting -r
  register: upgrade_reboot_check
  failed_when: false
  changed_when: false
  when: upgrade_reboot | bool
  tags:
    - upgrade

- name: Set reboot required fact (RedHat)
  ansible.builtin.set_fact:
    reboot_required:
      stat:
        exists: "{{ upgrade_reboot_check.rc | default(0) == 1 }}"
  when:
    - upgrade_reboot | bool
    - ansible_os_family == 'RedHat'
  tags:
    - upgrade
