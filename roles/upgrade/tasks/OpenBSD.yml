---

- name: Upgrade all packages
  ansible.builtin.command: pkg_add -u
  register: upgrade_pkg_result
  changed_when: upgrade_pkg_result.stdout | length > 0
  tags:
    - upgrade

- name: Clean package cache
  ansible.builtin.command: pkg_delete -a
  when: upgrade_clean_cache | bool
  changed_when: false
  failed_when: false
  tags:
    - upgrade
