---

- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600
  tags:
    - upgrade

- name: Upgrade all packages
  apt:
    upgrade: "{{ 'dist' if upgrade_dist_upgrade else 'safe' }}"
  register: apt_upgrade
  tags:
    - upgrade

- name: Remove unused packages
  apt:
    autoremove: true
    purge: true
  when: upgrade_autoremove | bool
  tags:
    - upgrade

- name: Clean apt cache
  apt:
    autoclean: true
  when: upgrade_clean_cache | bool
  tags:
    - upgrade

- name: Display upgraded packages
  debug:
    msg: "{{ apt_upgrade.stdout_lines | default([]) }}"
  when: apt_upgrade.changed
  tags:
    - upgrade
