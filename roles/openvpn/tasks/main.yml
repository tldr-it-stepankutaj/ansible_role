#  with_dict: "{{ openvpn_server_conf }}"
#  when: openvpn_easyrsa_server != 'localhost'

- name: setting server.conf
  template: src=server.conf.j2 dest=/etc/openvpn/server/{{ item.key }}.conf owner=root group=root mode=0644
  with_dict: "{{ openvpn_server_conf }}"
  notify: restart openvpn
  tags:
    - openvpn_config

- name: Create ccd dir
  file: path={{ openvpn_conf_dir | default('/etc/openvpn') }}/{{ item.key }}/ccd owner=root group=root mode=0755 state=directory
  with_dict: "{{ openvpn_server_conf }}"

#- name: setting allow access
#  template: src=security/access_openvpn.conf.j2 dest=/etc/security/access_openvpn.conf owner=root group=root mode=0644
#
#- name: copying pam file to pam.d
#  copy: src=pam.d/openvpn dest=/etc/pam.d/openvpn owner=root group=root mode=0644

- include: ccd.yml
  with_dict: "{{ openvpn_ccd }}"
  loop_control:
    loop_var: openvpn_ccd_dict
  tags:
    - openvpn_config
    - openvpn_ccd

- name: Create client config dir
  file: path={{ openvpn_conf_dir | default('/etc/openvpn') }}/{{ item.key }}/client owner=root group=root mode=0700 state=directory
  with_dict: "{{ openvpn_server_conf }}"
  tags:
    - openvpn_client_config
      
- include: client-config.yml
  with_dict: "{{ openvpn_ccd }}"
  loop_control:
    loop_var: openvpn_ccd_dict
  tags:
    - openvpn_config

- name: Service start and enabled on boot 
  service: name=openvpn-server@{{ item.key }} enabled=yes state=started
  with_dict: "{{ openvpn_server_conf }}"
  when: easyrsa.pki is defined and easyrsa.pki | length > 0


