---
haproxy_socket: /var/lib/haproxy/stats
haproxy_chroot: /var/lib/haproxy
haproxy_user: haproxy
haproxy_group: haproxy

# Frontend settings.
haproxy_frontend_name: 'kube-apiserver'
haproxy_frontend_bind_address: '*'
haproxy_frontend_port: 6443
haproxy_frontend_mode: 'tcp'
haproxy_frontend_option: 'tcplog'

# Backend settings.
haproxy_backend_name: 'kube-apiserver'
haproxy_backend_mode: 'tcp'
haproxy_backend_balance_method: 'roundrobin'
haproxy_backend_option: 
  - 'tcplog'
  - 'tcp-check'

# List of backend servers.
haproxy_backend_servers: []
# - name: app1
#   address: 192.168.0.1:80
# - name: app2
#   address: 192.168.0.2:80

# Extra global vars (see README for example usage).
haproxy_global_vars: []

# Default haproxy timeouts
haproxy_connect_timeout: 5000
haproxy_client_timeout: 50000
haproxy_server_timeout: 50000
