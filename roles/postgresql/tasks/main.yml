---
- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_os_family }}.yml"
  tags:
    - postgresql

- name: Include OS-specific setup tasks
  ansible.builtin.include_tasks: "{{ item }}"
  with_first_found:
    - "setup-{{ ansible_os_family }}.yml"
  tags:
    - postgresql

- name: Install PostgreSQL packages
  ansible.builtin.package:
    name: "{{ postgresql_packages }}"
    state: present
  tags:
    - postgresql

- name: Check if PostgreSQL database is initialized (RedHat)
  ansible.builtin.stat:
    path: "{{ postgresql_data_dir }}/PG_VERSION"
  register: postgresql_pgversion
  when: ansible_os_family == 'RedHat'
  tags:
    - postgresql

- name: Initialize PostgreSQL database (RedHat)
  ansible.builtin.command: "{{ postgresql_bin_dir }}/postgresql-{{ postgresql_version }}-setup initdb"
  when:
    - ansible_os_family == 'RedHat'
    - not postgresql_pgversion.stat.exists
  changed_when: true
  tags:
    - postgresql

- name: Ensure PostgreSQL listen_addresses is configured
  ansible.builtin.lineinfile:
    dest: "{{ postgresql_conf_dir }}/postgresql.conf"
    regexp: '^#?listen_addresses\s*='
    line: "listen_addresses = '{{ postgresql_listen_addresses }}'"
    state: present
  notify: Restart postgresql
  tags:
    - postgresql

- name: Ensure PostgreSQL port is configured
  ansible.builtin.lineinfile:
    dest: "{{ postgresql_conf_dir }}/postgresql.conf"
    regexp: '^#?port\s*='
    line: "port = {{ postgresql_port }}"
    state: present
  notify: Restart postgresql
  tags:
    - postgresql

- name: Apply extra PostgreSQL configuration
  ansible.builtin.lineinfile:
    dest: "{{ postgresql_conf_dir }}/postgresql.conf"
    regexp: "^#?{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    state: present
  loop: "{{ postgresql_extra_config | dict2items }}"
  notify: Restart postgresql
  when: postgresql_extra_config | length > 0
  tags:
    - postgresql

- name: Configure pg_hba.conf entries
  ansible.builtin.blockinfile:
    dest: "{{ postgresql_conf_dir }}/pg_hba.conf"
    block: |
      {% for entry in postgresql_hba_entries %}
      {{ entry }}
      {% endfor %}
    marker: "# {mark} ANSIBLE MANAGED BLOCK"
  notify: Restart postgresql
  tags:
    - postgresql

- name: Change local auth from peer to trust
  ansible.builtin.replace:
    path: "{{ postgresql_conf_dir }}/pg_hba.conf"
    regexp: '^(local\s+\S+\s+\S+\s+)peer'
    replace: '\1trust'
  when: postgresql_local_auth_trust | bool
  notify: Restart postgresql
  tags:
    - postgresql

- name: Start and enable PostgreSQL service
  ansible.builtin.systemd:
    name: "{{ postgresql_service }}"
    state: started
    enabled: true
  tags:
    - postgresql

- name: Create PostgreSQL admin user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ postgresql_admin_user }}"
    password: "{{ postgresql_admin_password }}"
    role_attr_flags: CREATEDB,SUPERUSER,CREATEROLE
    encrypted: true
    state: present
  tags:
    - postgresql
