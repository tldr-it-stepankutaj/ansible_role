---

- name: 'Uninstall firewalld and iptables'
  package: 
    state: absent 
    name:
      - firewalld
      - iptables 
      - iptables-services
  when: ansible_os_family == "RedHat" and ansible_distribution_major_version | int > 7

- name: 'Install package'
  package:
    name: 'nftables'
    state: 'present'
